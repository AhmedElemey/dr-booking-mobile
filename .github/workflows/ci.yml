name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      # Format check runs before pub get, which generates lib/core/l10n/generated/.
      - run: dart format --set-exit-if-changed .
      - run: flutter pub get
      # The committed brand/platform files must match clinic.config.json.
      # On a pull request that is checked (no diff allowed). The console commits
      # a new clinic.config.json straight to main, so there the files are
      # regenerated first (apply-brand.yml then commits the result).
      - run: dart run tool/apply_brand.dart
      - if: github.event_name == 'pull_request'
        run: git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      # The clinic's Firebase config is a secret-held file, never committed. Without
      # the secret the build still works and push stays off.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
